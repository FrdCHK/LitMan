name: Release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer package version
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: choco install wixtoolset --version=3.14.1 --yes
      - run: cargo install mdbook --version 0.4.52 --locked
      - shell: powershell
        run: ./scripts/package-windows.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi

  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo install mdbook --version 0.4.52 --locked
      - run: bash scripts/package-macos.sh '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/LitMan.app
            dist/*.dmg
            dist/*.pkg

  centos7-rpm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in pinned CentOS 7.9 environment
        run: docker build --build-arg RUST_VERSION=1.97.1 -t litman-centos7 -f packaging/centos7/Dockerfile .
      - run: mkdir -p dist && docker run --rm -v "$PWD:/workspace" -v "$PWD/dist:/out" litman-centos7 /bin/bash /workspace/scripts/build-centos7.sh '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: centos7-rpm
          path: dist/*.rpm
